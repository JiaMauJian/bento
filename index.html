:root{
  --paper:#F3F5F2; --sheet:#FFFFFF; --ink:#1F2629; --muted:#687175; --rule:#DCE1DD;
  --seal:#BE3426; --seal-soft:#FBE9E6; --leaf:#2E6A49; --leaf-soft:#E2EFE6; --warn:#9A5B00;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141819; --sheet:#1D2224; --ink:#E8ECEA; --muted:#9AA3A6; --rule:#30383A;
    --seal:#E5594A; --seal-soft:#3A1F1C; --leaf:#72C394; --leaf-soft:#1C3226; --warn:#E3A84B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141819; --sheet:#1D2224; --ink:#E8ECEA; --muted:#9AA3A6; --rule:#30383A;
  --seal:#E5594A; --seal-soft:#3A1F1C; --leaf:#72C394; --leaf-soft:#1C3226; --warn:#E3A84B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:680px;margin:0 auto;padding:20px 16px 225px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:8px 0 18px;border-bottom:2px solid var(--ink)}
.date{color:var(--muted);font-size:14px}
.shop{font-family:var(--serif);font-weight:900;font-size:clamp(34px,9vw,48px);line-height:1.15;margin:2px 0 6px;letter-spacing:.04em}
.meta{font-size:14px;color:var(--muted);margin:0}
.meta a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.rule-line{margin:6px 0 0;font-size:14px;font-weight:500}
.seal{font-family:var(--serif);font-weight:900;font-size:20px;writing-mode:vertical-rl;letter-spacing:.18em;
  color:var(--seal);border:3px solid var(--seal);border-radius:8px;padding:12px 6px;transform:rotate(-6deg);margin:6px 4px 0 0;line-height:1}
.seal.muted{color:var(--muted);border-color:var(--muted);border-style:dashed}
.seal.stamp{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-14deg) scale(1.6);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.seal.stamp{animation:none}}

/* panels */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px;margin:18px 0}
.panel h2,.sec h2{font-size:17px;margin:0 0 10px;font-weight:700}
.owner{border-left:4px solid var(--seal)}
.row-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.shops{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.shopbtn{text-align:left;background:var(--paper);border:2px solid var(--rule);border-radius:10px;padding:12px}
.shopbtn b{display:block;font-family:var(--serif);font-size:20px}
.shopbtn span{font-size:13px;color:var(--muted)}
.shopbtn[aria-pressed="true"]{border-color:var(--seal);background:var(--seal-soft)}
.shopbtn:disabled{opacity:.45;cursor:not-allowed}
label.inline{display:flex;align-items:center;gap:8px;font-size:15px}
input[type=time],input[type=text],input[type=password]{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;min-width:0}
.btn{border:none;border-radius:8px;padding:10px 16px;font-weight:700;background:var(--ink);color:var(--sheet)}
.btn.primary{background:var(--seal);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink);font-weight:500}
.btn.danger{background:transparent;border:1px solid var(--seal);color:var(--seal)}
.btn.ghost[aria-pressed="true"]{border-color:var(--seal);background:var(--seal-soft);font-weight:700}
.seg{display:flex;gap:6px;margin:18px 0 8px;align-items:center;flex-wrap:wrap}
.seg h2{margin:0 auto 0 0}
.seg .btn{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* threshold */
.th-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.th-msg{font-weight:700}
.th-msg.ok{color:var(--leaf)}
.th-msg.no{color:var(--warn)}
.bar{height:10px;background:var(--paper);border-radius:6px;overflow:hidden;margin-top:8px;border:1px solid var(--rule)}
.bar i{display:block;height:100%;background:var(--warn);transition:width .3s}
.bar i.ok{background:var(--leaf)}

/* menu */
.sec{margin:26px 0}
.sec h2{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.sec h2 small{font-weight:400;color:var(--muted);font-size:13px}
.item{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding:10px 0 10px 10px;border-bottom:1px dashed var(--rule);border-left:3px solid transparent}
.item.on{border-left-color:var(--leaf);background:linear-gradient(90deg,var(--leaf-soft),transparent 70%)}
.iname{font-weight:500;flex:1 1 160px}
.tag{display:inline-block;font-size:12px;font-weight:500;color:var(--seal);border:1px solid var(--seal);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;line-height:1.5}
.tag.t2{color:var(--muted);border-color:var(--muted)}
.vars{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:flex-end}
.var{display:flex;align-items:center;gap:8px}
.vlabel{font-size:14px;color:var(--muted);white-space:nowrap}
.vlabel b{color:var(--ink);font-weight:500}
.stepper{display:flex;align-items:center;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
.stepper button{width:34px;height:34px;border:none;background:none;font-size:18px;line-height:1}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper span{min-width:22px;text-align:center;font-weight:700}

/* board */
.agg{margin:0;padding:0;list-style:none}
.agg li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--rule)}
.agg li:last-child{border-bottom:none}
.tot{display:flex;justify-content:space-between;font-weight:700;padding-top:10px;margin-top:4px;border-top:2px solid var(--ink)}
.people{margin:0;padding:0;list-style:none}
.people li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px dashed var(--rule)}
.people li:last-child{border-bottom:none}
.people .who{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.people .who img{width:24px;height:24px;border-radius:50%;flex:none}
.people .acct{font-weight:400;font-size:13px;color:var(--muted)}
.people .what{grid-column:1/2;font-size:14px;color:var(--muted)}
.people .amt{text-align:right;font-weight:700}
.people .paid{grid-column:2/3;grid-row:2;text-align:right;font-size:14px}
.paidtag{color:var(--leaf);font-weight:500}
textarea{width:100%;min-height:150px;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px;font:14px/1.6 var(--sans);color:var(--ink);resize:vertical}

/* bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:2px solid var(--ink);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.dock .nm{display:flex;align-items:center;gap:8px;grid-column:1/-1}
.dock .nm input{flex:1}
.people .note{grid-column:1/2;font-size:14px;color:var(--seal)}
.dock .sum{font-size:15px}
.dock .sum b{font-size:20px}
.dock .acts{display:flex;gap:8px;align-items:center}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:14px;padding:4px}

.toast{position:fixed;left:50%;bottom:calc(195px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
.toast.show{opacity:1}
@media (max-width:420px){.shops{grid-template-columns:1fr}}

.paybig{font-size:18px;margin:0 0 10px}
.paybig b{font-size:28px;color:var(--seal)}
</style>
</head>

/* 有 days 的店家每天菜單不同：菜單範圍內沒列到的日子是店休，超過範圍（還沒更新）就用 groups 的常見品項 */
function lastDay(sh){ return Object.keys(sh.days).sort().pop() || ""; }
function groupsOf(sh, date){ return !sh.days ? sh.groups : sh.days[date] || (date > lastDay(sh) ? sh.groups : null); }
function allGroups(sh){ return sh.days ? [].concat.apply(sh.groups, Object.keys(sh.days).map(function(d){ return sh.days[d]; })) : sh.groups; }

/* key -> {label, price, shop, order, nocount} */
var ITEMS = {}; (function(){ var n=0; Object.keys(SHOPS).forEach(function(sk){ allGroups(SHOPS[sk]).forEach(function(g){ g.items.forEach(function(it){ it.v.forEach(function(v){
  var key = it.id + "." + v[0];
  ITEMS[key] = { label: it.name + (v[1] ? "（" + v[1] + "）" : ""), price: v[2], shop: sk, order: n++, nocount: !!g.nocount };
}); }); }); }); })();

function lsGet(k){ try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } }
function lsSet(k,v){ try{ if(v) localStorage.setItem(k,v); else localStorage.removeItem(k); }catch(e){} }
function newToken(){ var a=new Uint8Array(16); crypto.getRandomValues(a); return Array.prototype.map.call(a,function(b){ return ("0"+b.toString(16)).slice(-2); }).join(""); }

var TOKEN = lsGet("bento_token"); if(!TOKEN){ TOKEN=newToken(); lsSet("bento_token", TOKEN); }

var S = {
  loading:true, failed:false, session:null, late:false, orders:[], cart:{}, name:lsGet("bento_name"), note:"", dirty:false, round:null,
  adminShop:"chunfu", adminDate:today(), adminDeadline:"10:30", sumMode:"item", busy:false, lastPhase:null
};

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function $(id){ return document.getElementById(id); }
function prettyDate(s){ if(!s) return ""; var d=new Date(s+"T00:00:00"); return (d.getMonth()+1)+"/"+d.getDate()+"（"+"日一二三四五六".charAt(d.getDay())+"）"; }
function todayPretty(){ var d=new Date(); return (d.getMonth()+1)+"/"+d.getDate()+"（"+"日一二三四五六".charAt(d.getDay())+"）"; }
function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove("show"); }, 2800); }
function patch(el, html){
  if(el._h === html) return; el._h = html;
  var a=document.activeElement, id=null, ss=null, se=null;
  if(a && el.contains(a) && a.id){ id=a.id; try{ ss=a.selectionStart; se=a.selectionEnd; }catch(e){} }
  el.innerHTML = html;
  if(id){ var n=document.getElementById(id); if(n){ n.focus({preventScroll:true}); try{ if(ss!=null) n.setSelectionRange(ss,se); }catch(e){} } }
}

/* ---------- 資料庫 ----------
   /session          {shop, deadline, date, status: idle|open|closed, round}
   /orders/{token}   {name, note, lines:[{key,qty}], paid, updatedAt}
   orders 只放這一輪的單，開單和開新一輪時整個清掉。 */
var configured = /^https:\/\/.+(firebaseio\.com|firebasedatabase\.app)/.test(DB_URL);
var db = configured ? firebase.initializeApp({ databaseURL: DB_URL }).database() : null;

function pad(n){ return ("0"+n).slice(-2); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function nowStr(){ var d=new Date(); return today()+" "+pad(d.getHours())+":"+pad(d.getMinutes()); }
function isLate(s){ return !!(s && s.date && s.deadline) && nowStr() > s.date+" "+s.deadline; }

var KEEP_DAYS = 3;
function isExpired(s){ return !!(s && s.date) && (new Date(today()+"T00:00:00") - new Date(s.date+"T00:00:00")) >= KEEP_DAYS*864e5; }

function onData(v){
  v = v || {};
  // 開單超過 3 天就清掉訂單，回到選店家；清完資料庫會再觸發一次 onData
  if(isExpired(v.session)){ db.ref().update({ session:{ status:"idle", shop:v.session.shop||"chunfu" }, orders:null }); return; }
  S.session = v.session || null;
  S.orders = Object.keys(v.orders || {}).map(function(k){
    var o=v.orders[k]; return { pid:k, name:o.name||"", lines:o.lines||[], paid:!!o.paid, updatedAt:o.updatedAt||0, note:o.note||"", mine:k===TOKEN };
  });
  S.late = isLate(S.session);
  if(S.loading){
    if(S.session && S.session.deadline) S.adminDeadline=S.session.deadline;
    if(S.session && SHOPS[S.session.shop]) S.adminShop=S.session.shop;
  }
  S.loading=false; S.failed=false; syncFromServer(); render();
}

/* ---------- derived ---------- */
function shop(){ return S.session && SHOPS[S.session.shop] ? SHOPS[S.session.shop] : null; }
function phase(){
  var s=S.session;
  if(!s || s.status==="idle" || !shop()) return "idle";
  if(s.status==="closed") return "closed";
  return S.late ? "late" : "open";
}
function roundOrders(){ return S.orders.filter(function(o){ return o.lines && o.lines.length; }); }
function myOrder(){ for(var i=0;i<S.orders.length;i++){ if(S.orders[i].mine) return S.orders[i]; } return null; }
function linesCalc(lines, sk){
  var amt=0, cnt=0, rc=0; (lines||[]).forEach(function(l){ var it=ITEMS[l.key]; if(it && it.shop===sk && l.qty>0){ amt+=it.price*l.qty; cnt+=l.qty; if(!it.nocount) rc+=l.qty; } }); return {amt:amt, cnt:cnt, rc:rc};
}
function cartLines(){ var sk=S.session&&S.session.shop; return Object.keys(S.cart).filter(function(k){ return S.cart[k]>0 && ITEMS[k] && ITEMS[k].shop===sk; }).sort(function(a,b){ return ITEMS[a].order-ITEMS[b].order; }).map(function(k){ return {key:k, qty:S.cart[k]}; }); }
function linesText(lines){ return lines.filter(function(l){ return ITEMS[l.key]; }).map(function(l){ return ITEMS[l.key].label+"×"+l.qty; }).join("、"); }
function aggregate(){
  var sk=S.session.shop, m={}; roundOrders().forEach(function(o){ o.lines.forEach(function(l){ var it=ITEMS[l.key]; if(it && it.shop===sk && l.qty>0) m[l.key]=(m[l.key]||0)+l.qty; }); });
  return Object.keys(m).sort(function(a,b){ return ITEMS[a].order-ITEMS[b].order; }).map(function(k){ return {key:k, qty:m[k]}; });
}
function syncFromServer(){
  var r=S.session && S.session.round;
  if(r !== S.round){ S.round=r; S.dirty=false; }
  if(S.dirty) return;
  var mo=myOrder(); S.cart={};
  if(mo) mo.lines.forEach(function(l){ S.cart[l.key]=l.qty; });
  if(mo && mo.name) S.name=mo.name;
  S.note = mo ? (mo.note||"") : "";
}

/* ---------- render ---------- */
function render(){
  var all=["hdr","admin","status","menu","pay","board","bar","foot"];
  if(!configured){
    patch($("hdr"), '<div class="empty"><b>還沒設定資料庫網址</b>請把 index.html 開頭的 DB_URL 換成你的 Firebase 即時資料庫網址。</div>');
    all.slice(1).forEach(function(id){ patch($(id), ""); }); return;
  }
  if(S.loading){ patch($("hdr"), '<div class="empty">載入中…</div>'); return; }
  if(S.failed){
    patch($("hdr"), '<div class="empty"><b>連不到點餐資料</b>請稍後重新整理，或確認 Firebase 的規則有開放讀寫。</div>');
    all.slice(1).forEach(function(id){ patch($(id), ""); }); return;
  }
  var ph=phase(), sh=shop();
  renderHeader(ph, sh); renderAdmin(ph, sh); renderStatus(ph, sh); renderMenu(ph, sh); renderPay(ph, sh); renderBoard(ph, sh); renderBar(ph, sh);
  S.lastPhase=ph;
}

function renderHeader(ph, sh){
  var seal = { idle:["未開單","muted"], open:["收單中",""], late:["已截止",""], closed:["已結單",""] }[ph];
  var stamp = S.lastPhase && S.lastPhase!==ph && ph!=="idle" ? " stamp" : "";
  var h='<header class="hdr"><div>';
  if(ph==="idle"){
    h+='<div class="date">'+esc(todayPretty())+'</div><h1 class="shop">今天訂便當</h1><p class="meta">選好店家和截止時間就能開始收單。花梅蘭可以選日期預訂。</p>';
  } else {
    h+='<div class="date">'+esc(prettyDate(S.session.date))+'　截止 '+esc(S.session.deadline)+'</div>';
    h+='<h1 class="shop">'+esc(sh.name)+'</h1>';
    h+='<p class="meta"><a href="tel:'+esc(sh.phone)+'">'+esc(sh.phone)+'</a>　'+esc(sh.addr)+'</p>';
    h+='<p class="rule-line">'+esc(sh.rule.label)+'　<span style="font-weight:400;color:var(--muted)">'+esc(sh.note)+'</span></p>';
  }
  h+='</div><div class="seal '+seal[1]+stamp+'" aria-label="狀態：'+seal[0]+'">'+seal[0]+'</div></header>';
  patch($("hdr"), h);
}

/* 沒開單時，選店家放最上面；開單後主揪按鈕移到頁尾，不擋點餐 */
function renderAdmin(ph, sh){
  var dis=S.busy?' disabled':'';
  var h='<section class="panel owner" aria-label="主揪設定">';
  if(ph==="idle"){
    h+='<h2>今天訂哪一家？</h2><div class="shops">';
    /* 每天菜單不同的店（花梅蘭）可以選日期預訂，所以店休那天也能點進去改日期 */
    Object.keys(SHOPS).forEach(function(k){
      var sh=SHOPS[k], off=!groupsOf(sh, sh.days ? S.adminDate : today());
      h+='<button class="shopbtn" data-act="pick" data-shop="'+k+'" aria-pressed="'+(S.adminShop===k)+'"'+(off&&!sh.days?' disabled':'')+'><b>'+esc(sh.name)+'</b><span>'+esc(off?prettyDate(S.adminDate)+"沒有菜單（店休）":sh.rule.label)+'</span></button>';
    });
    h+='</div><div class="row-ctl">';
    if(SHOPS[S.adminShop].days) h+='<label class="inline">日期 <input id="dt" type="date" min="'+today()+'" value="'+esc(S.adminDate)+'" data-in="dt"></label>';
    h+='<label class="inline">截止時間 <input id="dl" type="time" value="'+esc(S.adminDeadline)+'" data-in="dl"></label>';
    h+='<button class="btn primary" data-act="open"'+dis+'>開始收單</button></div>';
    h+='<p class="hint">開單後把這頁的網址丟到群組，同事就能點餐。</p>';
  } else if(ph==="open" || ph==="late"){
    h+='<h2>主揪：'+(ph==="late"?"已過截止時間，大家暫時不能點":"收單中")+'</h2><div class="row-ctl">';
    h+='<label class="inline">截止時間 <input id="dl" type="time" value="'+esc(S.adminDeadline)+'" data-in="dl"></label>';
    h+='<button class="btn ghost" data-act="setdl"'+dis+'>更新截止時間</button>';
    h+='<button class="btn primary" data-act="close"'+dis+'>結單</button></div>';
  } else {
    h+='<h2>主揪：已結單</h2><div class="row-ctl">';
    h+='<button class="btn ghost" data-act="reopen"'+dis+'>重新開放點餐</button>';
    h+='<button class="btn danger" data-act="newround"'+dis+'>'+"開新一輪"+'</button></div>';
    h+='<p class="hint">開新一輪會清除這次所有人的訂單，回到選店家。</p>';
  }
  h+='</section>';
  patch($("admin"), ph==="idle" ? h : "");
  patch($("foot"), ph==="idle" ? "" : h);
}

function renderStatus(ph, sh){
  if(ph==="idle"){ patch($("status"), ""); return; }
  var ords=roundOrders(), amt=0, cnt=0, rc=0;
  ords.forEach(function(o){ var c=linesCalc(o.lines, S.session.shop); amt+=c.amt; cnt+=c.cnt; rc+=c.rc; });
  var r=sh.rule, val = r.type==="amount" ? amt : rc, ok = val>=r.min, pct=Math.min(100, Math.round(val/r.min*100));
  var msg = ok ? "已達外送門檻" : (r.type==="amount" ? "還差 "+(r.min-amt)+" 元" : "還差 "+(r.min-rc)+" 份");
  var h='<section class="panel"><div class="th-top"><span class="th-msg '+(ok?"ok":"no")+'">'+msg+'</span>';
  h+='<span class="num">'+ords.length+' 人點餐，共 '+cnt+' 份，$'+amt+'</span></div>';
  h+='<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+r.min+'" aria-valuenow="'+val+'"><i class="'+(ok?"ok":"")+'" style="width:'+pct+'%"></i></div>';
  h+='</section>';
  patch($("status"), h);
}

function renderMenu(ph, sh){
  if(ph!=="open"){ patch($("menu"), ""); return; }
  var h = sh.days && !sh.days[S.session.date] ? '<p class="hint">店家還沒公布這天的菜單，先列常見品項，請以店家當日菜單為準。</p>' : '';
  (groupsOf(sh, S.session.date) || []).forEach(function(g){
    h+='<section class="sec"><h2>'+esc(g.title)+(g.sub?' <small>'+esc(g.sub)+'</small>':'')+'</h2>';
    g.items.forEach(function(it){
      var any=false, vh='';
      it.v.forEach(function(v){
        var key=it.id+"."+v[0], q=S.cart[key]||0; if(q>0) any=true;
        vh+='<div class="var"><span class="vlabel">'+(v[1]?esc(v[1])+' ':'')+'<b class="num">$'+v[2]+'</b></span>';
        vh+='<div class="stepper"><button data-act="dec" data-key="'+key+'" aria-label="減少 '+esc(ITEMS[key].label)+'"'+(q?'':' disabled')+'>−</button><span class="num" aria-live="polite">'+q+'</span><button data-act="inc" data-key="'+key+'" aria-label="增加 '+esc(ITEMS[key].label)+'">+</button></div>';
        vh+='</div>';
      });
      h+='<div class="item'+(any?' on':'')+'"><div class="iname">'+esc(it.name)+(it.rec?'<span class="tag">推薦</span>':'')+(it.wk?'<span class="tag t2">平日中午</span>':'')+(it.sub?'<div class="vlabel">'+esc(it.sub)+'</div>':'')+'</div><div class="vars">'+vh+'</div></div>';
    });

function renderPay(ph, sh){
  var mo=myOrder();

function summaryText(){
  var sh=shop(), agg=aggregate(), c=0, a=0;
  var t=sh.name+" 訂單 "+prettyDate(S.session.date)+"\n";
  if(S.sumMode==="person"){
    var ords=roundOrders().slice().sort(function(x,y){ return (x.updatedAt||0)-(y.updatedAt||0); });
    ords.forEach(function(o){
      var oc=linesCalc(o.lines, S.session.shop); c+=oc.cnt; a+=oc.amt;
      t+=(o.name||"未填名字")+" $"+oc.amt+(o.paid?"（已付）":"")+"："+linesText(o.lines)+(o.note?"（備註："+o.note+"）":"")+"\n";
    });
    t+=ords.length+" 人，共 "+c+" 份，$"+a;
    return t;
  }
  agg.forEach(function(l){ t+=ITEMS[l.key].label+" ×"+l.qty+"\n"; c+=l.qty; a+=ITEMS[l.key].price*l.qty; });
  t+="共 "+c+" 份，$"+a;
  var notes=roundOrders().filter(function(o){ return o.note; });
  if(notes.length){ t+="\n備註："; notes.forEach(function(o){ t+="\n"+(o.name||"未填名字")+"："+linesText(o.lines)+" → "+o.note; }); }
  return t;
}

function renderBoard(ph, sh){

  var agg=aggregate(), cnt=0, amt=0, h='';

  agg.forEach(function(l){ var it=ITEMS[l.key]; cnt+=l.qty; amt+=it.price*l.qty; h+='<li><span>'+esc(it.label)+'</span><span class="num">×'+l.qty+'</span></li>'; });
  h+='</ul><div class="tot"><span>共 '+cnt+' 份</span><span class="num">$'+amt+'</span></div>';
  if(ph!=="open"){
    h+='<div class="seg"><h2>'+(S.sumMode==="person"?"每個人點什麼":"打電話用")+'</h2>';

  }
  h+='</section><section class="panel"><h2>每個人</h2><ul class="people">';
  ords.forEach(function(o){

  });
  h+='</ul></section>';
  patch($("board"), h);
}

function renderBar(ph, sh){
  var m=document.querySelector("main");
  if(ph!=="open"){ patch($("bar"), ""); m.style.paddingBottom="40px"; return; }
  m.style.paddingBottom="";
  var lines=cartLines(), c=linesCalc(lines, S.session.shop), mo=myOrder();
  var label = !mo ? "送出訂單" : (S.dirty ? "更新訂單" : "已送出");
  var dis = S.busy || (!S.dirty && !!mo) || (!mo && !lines.length);
  var h='<div class="dock"><div class="dock-in">';
  h+='<div class="nm"><label for="nm" style="font-size:14px;white-space:nowrap">名字</label><input id="nm" type="text" maxlength="20" placeholder="隨便打，可以辨識就好" value="'+esc(S.name)+'" data-in="nm" autocomplete="name"></div>';
  h+='<div class="nm"><label for="nt" style="font-size:14px;white-space:nowrap">備註</label><input id="nt" type="text" maxlength="50" placeholder="例如：不要豬肉、飯少（可不填）" value="'+esc(S.note)+'" data-in="nt"></div>';
  h+='<div class="sum num">'+c.cnt+' 份　<b>$'+c.amt+'</b></div>';
  h+='<div class="acts">'+(mo?'<button class="linkbtn" data-act="cancel"'+(S.busy?' disabled':'')+'>取消訂單</button>':'')+'<button class="btn primary" data-act="submit"'+(dis?' disabled':'')+'>'+label+'</button></div>';
  h+='</div></div>';
  patch($("bar"), h);
}

/* ---------- actions ---------- */
function run(write, okMsg, after){
  if(S.busy) return; S.busy=true; render();
  return write().then(function(){
    if(after) after();
    if(okMsg) toast(okMsg);
  }).catch(function(){ toast("連線失敗，請稍後再試"); })
  .then(function(){ S.busy=false; render(); });
}
function canOrder(){
  S.late=isLate(S.session);
  if(phase()==="open") return true;
  toast("已經截止，不能再改了"); render(); return false;
}
var myRef=function(){ return db.ref("orders/"+TOKEN); };
var sessionRef=function(){ return db.ref("session"); };

document.addEventListener("click", function(ev){
  var b=ev.target.closest("[data-act]"); if(!b || b.disabled) return;
  var act=b.getAttribute("data-act");
  if(act==="inc" || act==="dec"){
    var k=b.getAttribute("data-key"), q=(S.cart[k]||0)+(act==="inc"?1:-1);
    if(q<=0) delete S.cart[k]; else S.cart[k]=Math.min(q,99);
    S.dirty=true; render(); return;
  }
  if(act==="pick"){ S.adminShop=b.getAttribute("data-shop"); if(SHOPS[S.adminShop].deadline) S.adminDeadline=SHOPS[S.adminShop].deadline; render(); return; }
  if(act==="submit"){
    var lines=cartLines(), nm=S.name.trim().slice(0,20);
    if(!nm){ toast("請先填名字"); var n=$("nm"); if(n) n.focus(); return; }
    if(!canOrder()) return;
    lsSet("bento_name", nm);
    var mo=myOrder();
    if(!lines.length){ run(function(){ return myRef().remove(); }, "已取消你的訂單", function(){ S.dirty=false; }); return; }
    run(function(){ return myRef().update({ name:nm, note:S.note.trim().slice(0,50), lines:lines, updatedAt:firebase.database.ServerValue.TIMESTAMP }); },
      mo ? "訂單已更新" : "訂單已送出", function(){ S.dirty=false; });
    return;
  }
  if(act==="cancel"){ if(!canOrder()) return; run(function(){ return myRef().remove(); }, "已取消你的訂單", function(){ S.cart={}; S.dirty=false; }); return; }
  if(act==="open"){
    if(!S.adminDeadline){ toast("請設定截止時間"); return; }
    var date=SHOPS[S.adminShop].days ? S.adminDate : today();
    if(!date || date<today()){ toast("請選今天以後的日期"); return; }
    if(!groupsOf(SHOPS[S.adminShop], date)){ toast(SHOPS[S.adminShop].name+" "+prettyDate(date)+"沒有菜單"); return; }
    run(function(){ return db.ref().update({ session:{ shop:S.adminShop, deadline:S.adminDeadline, date:date, status:"open", round:Date.now() }, orders:null }); },
      "已開始收單，把網址丟到群組吧"); return;
  }
  if(act==="setdl"){ if(!S.adminDeadline){ toast("請設定截止時間"); return; } run(function(){ return sessionRef().update({ deadline:S.adminDeadline, status:"open" }); }, "截止時間已更新"); return; }
  if(act==="close"){ run(function(){ return sessionRef().update({ status:"closed" }); }, "已結單"); return; }
  if(act==="reopen"){ if(S.late) toast("截止時間已過，記得更新截止時間"); run(function(){ return sessionRef().update({ status:"open" }); }); return; }
  if(act==="newround"){
    run(function(){ return db.ref().update({ session:{ status:"idle", shop:S.session.shop }, orders:null }); }, "已清除，可以重新選店家"); return;
  }
  if(act==="summode"){ S.sumMode=b.getAttribute("data-mode"); render(); return; }
  if(act==="copy"){
    var ta=$("sumtext"), txt=summaryText();
    var done=function(){ toast("已複製"); };
    var fallback=function(){ if(ta){ ta.focus(); ta.select(); try{ if(document.execCommand("copy")){ done(); return; } }catch(e){} } toast("請長按文字框手動複製"); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, fallback); } else fallback();
    return;
  }
});

document.addEventListener("input", function(ev){
  var k=ev.target.getAttribute && ev.target.getAttribute("data-in");
  if(k==="nm"){ S.name=ev.target.value; S.dirty=true; $("bar")._h=null; renderBar(phase(), shop()); }
  if(k==="nt"){ S.note=ev.target.value; S.dirty=true; $("bar")._h=null; renderBar(phase(), shop()); }
  if(k==="dl"){ S.adminDeadline=ev.target.value; }
});

document.addEventListener("change", function(ev){
  if(ev.target.getAttribute && ev.target.getAttribute("data-in")==="dt"){ S.adminDate=ev.target.value; render(); return; }
  var pid=ev.target.getAttribute && ev.target.getAttribute("data-paid");
  if(!pid) return;
  var val=ev.target.checked;
  db.ref("orders/"+pid+"/paid").set(val).catch(function(){ ev.target.checked=!val; toast("連線失敗，請稍後再試"); });
});

/* ---------- boot ---------- */
(function(){
  render();
  if(!configured) return;
  var fail=function(){ if(S.loading){ S.failed=true; S.loading=false; render(); } };
  db.ref().on("value", function(snap){ onData(snap.val()); }, function(){ S.loading=true; fail(); });
  setTimeout(fail, 15000);
  // 截止時間是在瀏覽器判斷的，時間到要自己重畫
  setInterval(function(){ if(S.loading || S.failed) return; var l=isLate(S.session); if(l!==S.late){ S.late=l; render(); } }, 10000);
})();
</script>
</body>
</html>
