# 每天自動抓花梅蘭的新菜單，有變動就 commit，GitHub Pages 會跟著更新。
# 抓失敗（例如店家網站改版）時這個 workflow 會失敗，GitHub 會寄 email 通知。
name: 更新花梅蘭菜單

on:
  schedule:
    - cron: "0 22 * * *"   # 台灣時間每天早上 6:00
  workflow_dispatch:        # 也可以在 Actions 頁面手動按 Run workflow

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/hua-menu.js
      - name: 有變動就 commit
        run: |
          if git diff --quiet; then echo "菜單沒有變動"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "自動更新花梅蘭菜單"
          git push
