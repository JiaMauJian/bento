<style>
:root{
  --paper:#F3F5F2; --sheet:#FFFFFF; --ink:#1F2629; --muted:#687175; --rule:#DCE1DD;

  --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --serif:"Songti TC","Noto Serif TC","PMingLiU",serif;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141819; --sheet:#1D2224; --ink:#E8ECEA; --muted:#9AA3A6; --rule:#30383A;
    --seal:#E5594A; --seal-soft:#3A1F1C; --leaf:#72C394; --leaf-soft:#1C3226;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141819; --sheet:#1D2224; --ink:#E8ECEA; --muted:#9AA3A6; --rule:#30383A;
  --seal:#E5594A; --seal-soft:#3A1F1C; --leaf:#72C394; --leaf-soft:#1C3226;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:680px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{font-family:var(--serif);font-weight:900;font-size:clamp(28px,8vw,40px);margin:4px 0 14px;letter-spacing:.04em}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0}
.tab{text-align:left;background:var(--sheet);border:2px solid var(--rule);border-radius:10px;padding:8px 10px;min-width:0}
.tab b{display:block;font-family:var(--serif);font-size:17px;line-height:1.3}
.tab span{display:block;font-size:12px;line-height:1.4;color:var(--muted)}
@media (max-width:560px){.tabs{grid-template-columns:repeat(2,1fr)}}
.tab[aria-selected="true"]{border-color:var(--seal);background:var(--seal-soft)}

.info{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--seal);border-radius:10px;padding:14px 16px;margin:10px 0 6px}
.info h2{font-family:var(--serif);font-weight:900;font-size:26px;margin:0 0 6px;letter-spacing:.04em}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:15px}
.info dt{color:var(--muted)}
.info dd{margin:0}
.info a{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.rule{color:var(--seal);font-weight:700}

.sec{margin:24px 0}
.sec h3{display:flex;align-items:baseline;gap:8px;font-size:17px;margin:0 0 4px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.sec h3 small{font-weight:400;color:var(--muted);font-size:13px}
.item{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;padding:9px 0;border-bottom:1px dashed var(--rule)}
.iname{font-weight:500;flex:1 1 160px}
.sub{display:block;font-size:13px;color:var(--muted);font-weight:400}
.tag{display:inline-block;font-size:12px;font-weight:500;color:var(--seal);border:1px solid var(--seal);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;line-height:1.5}
.tag.t2{color:var(--muted);border-color:var(--muted)}
.prices{display:flex;flex-wrap:wrap;gap:2px 14px;justify-content:flex-end;font-size:15px}
.prices span{white-space:nowrap;color:var(--muted)}
.prices b{color:var(--ink);font-weight:700}
.foot{text-align:center;color:var(--muted);font-size:13px;margin:30px 0 0}
</style>

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function show(key){
  if(!SHOPS[key]) key = "chunfu";
  var sh = SHOPS[key], h = "";
  h += '<section class="info"><h2>'+esc(sh.name)+'</h2><dl>';
  h += '<dt>電話</dt><dd><a href="tel:'+esc(sh.phone)+'">'+esc(sh.phone)+'</a></dd>';
  h += '<dt>地址</dt><dd>'+esc(sh.addr)+'</dd>';
  h += '<dt>外送</dt><dd class="rule">'+esc(sh.rule)+'</dd>';
  h += '<dt>備註</dt><dd>'+esc(sh.note)+'</dd>';
  h += '</dl></section>';
  sh.groups.forEach(function(g){
    h += '<section class="sec"><h3>'+esc(g.title)+(g.sub ? ' <small>'+esc(g.sub)+'</small>' : '')+'</h3>';
    g.items.forEach(function(it){
      h += '<div class="item"><div class="iname">'+esc(it.name)
        + (it.rec ? '<span class="tag">推薦</span>' : '')
        + (it.wk ? '<span class="tag t2">平日中午</span>' : '')
        + (it.sub ? '<span class="sub">'+esc(it.sub)+'</span>' : '')
        + '</div><div class="prices">';
      it.v.forEach(function(v){ h += '<span>'+(v[0] ? esc(v[0])+' ' : '')+'<b class="num">$'+v[1]+'</b></span>'; });
      h += '</div></div>';
    });
    h += '</section>';
  });
  document.getElementById("shop").innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
    b.setAttribute("aria-selected", b.getAttribute("data-shop") === key);
  });
  if(location.hash !== "#"+key) history.replaceState(null, "", "#"+key);
}

(function(){

  });

  document.addEventListener("click", function(ev){
    var b = ev.target.closest(".tab"); if(!b) return;
    show(b.getAttribute("data-shop")); window.scrollTo(0, 0);
  });
  show(location.hash.slice(1));
})();
