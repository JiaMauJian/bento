}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121A24; --sheet:#1A2533; --ink:#E6ECF2; --muted:#98A4B3; --rule:#2C3A4B;
    --seal:#F5A033; --seal-ink:#F7B055; --on-seal:#1F3045; --seal-soft:#3A2A14;
    --leaf:#4CC3F0; --leaf-soft:#12303F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121A24; --sheet:#1A2533; --ink:#E6ECF2; --muted:#98A4B3; --rule:#2C3A4B;
  --seal:#F5A033; --seal-ink:#F7B055; --on-seal:#1F3045; --seal-soft:#3A2A14;
  --leaf:#4CC3F0; --leaf-soft:#12303F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:680px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{font-family:var(--serif);font-weight:900;font-size:clamp(34px,9vw,48px);line-height:1.15;margin:8px 0 14px;padding-bottom:18px;border-bottom:2px solid var(--ink);letter-spacing:.04em}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0}
.tab{text-align:left;background:var(--sheet);border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;min-width:0;transition:border-color .15s,background-color .15s}
.tab b{display:block;font-family:var(--serif);font-size:17px;line-height:1.35}
.tab span{display:block;font-size:12px;line-height:1.4;color:var(--muted)}
@media (max-width:560px){.tabs{grid-template-columns:repeat(2,1fr)}}
.tab:hover{border-color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--seal);background:var(--seal-soft);box-shadow:inset 0 0 0 1.5px var(--seal)}

.info{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin:10px 0 6px}
.info h2{font-family:var(--serif);font-weight:900;font-size:26px;margin:0 0 6px;letter-spacing:.04em}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:15px}
.info dt{color:var(--muted)}
.info dd{margin:0}
.info a{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.rule{color:var(--seal-ink);font-weight:700}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;margin:16px 0 0}
.day{background:var(--sheet);border:1.5px solid var(--rule);border-radius:10px;padding:6px 4px;text-align:center;line-height:1.35;transition:border-color .15s,background-color .15s}
.day small{display:block;font-size:12px;color:var(--muted)}
.day b{font-size:17px}
.day:hover{border-color:var(--muted)}
.day[aria-pressed="true"]{border-color:var(--seal);background:var(--seal);color:var(--on-seal)}
.day[aria-pressed="true"] small{color:inherit;opacity:.85}
.empty{text-align:center;color:var(--muted);padding:32px 0}

.sec{margin:24px 0}
.sec h3{display:flex;align-items:baseline;gap:8px;font-size:17px;margin:0 0 4px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.sec h3 small{font-weight:400;color:var(--muted);font-size:13px}
.item{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;padding:9px 0;border-bottom:1px dashed var(--rule)}
.iname{font-weight:500;flex:1 1 160px}
.sub{display:block;font-size:13px;color:var(--muted);font-weight:400}
.tag{display:inline-block;font-size:12px;font-weight:500;color:var(--seal-ink);border:1px solid var(--seal);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;line-height:1.5}
.tag.t2{color:var(--muted);border-color:var(--muted)}
.prices{display:flex;flex-wrap:wrap;gap:2px 14px;justify-content:flex-end;font-size:15px}
.prices span{white-space:nowrap;color:var(--muted)}
.prices b{color:var(--ink);font-weight:700}
.foot{text-align:center;color:var(--muted);font-size:13px;margin:30px 0 0}
.back{margin:0;font-size:15px}
.back a{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
</style>

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* 有 days 的店家每天菜單不同：只列今天以後的日期，預設今天或下一個有菜單的日子 */
function pad(n){ return ("0"+n).slice(-2); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
var pickedDay = "";

function show(key){
  if(!SHOPS[key]) key = "chunfu";
  var sh = SHOPS[key], h = "", groups = sh.groups;
  if(sh.days){
    var days = Object.keys(sh.days).filter(function(d){ return d >= today(); });
    if(days.indexOf(pickedDay) < 0) pickedDay = days[0] || "";
    groups = pickedDay ? sh.days[pickedDay] : sh.groups;
  }
  h += '<section class="info"><h2>'+esc(sh.name)+'</h2><dl>';
  if(sh.phone) h += '<dt>電話</dt><dd><a href="tel:'+esc(sh.phone)+'">'+esc(sh.phone)+'</a></dd>';
  if(sh.addr) h += '<dt>地址</dt><dd>'+esc(sh.addr)+'</dd>';
  h += '<dt>外送</dt><dd class="rule">'+esc(sh.rule)+'</dd>';
  h += '<dt>備註</dt><dd>'+esc(sh.note)+'</dd>';
  h += '</dl>';
  if(sh.days){
    if(days.length){
      h += '<div class="days">';
      days.forEach(function(d){
        var dd = new Date(d+"T00:00:00");
        h += '<button class="day" data-day="'+d+'" aria-pressed="'+(d===pickedDay)+'"><small>'+(d===today() ? "今天" : "週"+"日一二三四五六".charAt(dd.getDay()))+'</small><b class="num">'+(dd.getMonth()+1)+'/'+dd.getDate()+'</b></button>';
      });
      h += '</div>';
    }
  }
  h += '</section>';
  if(sh.days && !days.length) h += '<p class="empty">店家還沒公布新菜單，先列常見品項，請以店家當日菜單為準。</p>';
  groups.forEach(function(g){
    h += '<section class="sec"><h3>'+esc(g.title)+(g.sub ? ' <small>'+esc(g.sub)+'</small>' : '')+'</h3>';
    g.items.forEach(function(it){
      h += '<div class="item"><div class="iname">'+esc(it.name)
        + (it.rec ? '<span class="tag">推薦</span>' : '')
        + (it.wk ? '<span class="tag t2">平日中午</span>' : '')
        + (it.sub ? '<span class="sub">'+esc(it.sub)+'</span>' : '')
        + '</div><div class="prices">';
      it.v.forEach(function(v){ h += '<span>'+(v[0] ? esc(v[0])+' ' : '')+'<b class="num">$'+v[1]+'</b></span>'; });
      h += '</div></div>';
    });
    h += '</section>';
  });
  document.getElementById("shop").innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
    b.setAttribute("aria-selected", b.getAttribute("data-shop") === key);
  });
  if(location.hash !== "#"+key) history.replaceState(null, "", "#"+key);
}

(function(){
  var t = "";
  Object.keys(SHOPS).forEach(function(k){
    t += '<button class="tab" role="tab" data-shop="'+k+'"><b>'+esc(SHOPS[k].name)+'</b><span>'+esc(SHOPS[k].rule)+'</span></button>';
  });
  document.getElementById("tabs").innerHTML = t;
  document.addEventListener("click", function(ev){
    var d = ev.target.closest(".day");
    if(d){ pickedDay = d.getAttribute("data-day"); show(location.hash.slice(1)); return; }
    var b = ev.target.closest(".tab"); if(!b) return;
    show(b.getAttribute("data-shop")); window.scrollTo(0, 0);
  });
  show(location.hash.slice(1));
})();
</script>
